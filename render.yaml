services:
  - type: web
    name: context-bubble-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GOOGLE_CLOUD_PROJECT
        value: context-bubble-81904
      - key: GCS_BUCKET_NAME
        value: context-bubble-81904.firebasestorage.app
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SERVER_INTERNAL_SECRET
        generateValue: true
